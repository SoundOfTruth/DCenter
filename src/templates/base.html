<!DOCTYPE html>
<html lang="ru">
  <head>
    <title>Диагностический центр DCenter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css')}}" />
  </head>
  <body>
    <main>
      {% include "components/header.html" %}
      {% block title %}{% endblock %}
      <div class="container">
        {% block content %}
          {% for classname, message in get_flashed_messages(True) %}
            <div class="flash {{classname}}">
              {{ message }}
            </div>
          {% endfor %}
        {% endblock %}
      </div>
    </main>
  </body>
</html>
